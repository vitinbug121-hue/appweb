<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Sistema Automático Robotizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
  <style>
    body.tela-login {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .72) 0%, rgba(255, 255, 255, .86) 100%),
        url("{{ url_for('static', filename='img/fundo-login.jpg') }}") center / cover no-repeat fixed;
    }
    .cartao-login {
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(0, 35, 87, 0.08);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0, 35, 87, 0.12);
      overflow: hidden;
      background: #fff;
    }
    .cartao-login .topo {
      background: #fff;
      padding: 28px 28px 8px;
      text-align: center;
    }
    .cartao-login .topo img {
      width: 100%;
      max-width: 280px;
      height: auto;
      border-radius: 14px;
    }
    .cartao-login .corpo {
      padding: 20px 28px 28px;
    }
    .cartao-login .form-control {
      border-radius: 12px;
      padding: 10px 14px;
      border-color: #d7dee9;
    }
    .cartao-login .form-control:focus {
      border-color: var(--acp-orange);
      box-shadow: 0 0 0 .2rem rgba(255, 102, 0, .15);
    }
    .cartao-login .btn-entrar {
      border-radius: 12px;
      padding: 10px;
      font-weight: 600;
      background: var(--acp-orange);
      color: #fff;
      border: none;
    }
    .cartao-login .btn-entrar:hover { background: var(--acp-orange-dark); color: #fff; }
    .cartao-login .rodape {
      border-top: 4px solid var(--acp-orange);
      font-size: .75rem;
      color: #6c757d;
      text-align: center;
      padding: 10px;
      background: #fafbfd;
    }
  </style>
</head>
<body class="tela-login d-flex align-items-center justify-content-center p-3">
  <div class="cartao-login">
    <div class="topo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Mercado Livre · Sistema Automático Robotizado">
    </div>

    <div class="corpo">
      <h5 class="text-center fw-semibold mb-1" style="color: var(--acp-navy);">Entrar no sistema</h5>
      <p class="text-center text-muted small mb-4">Use seu usuário e senha</p>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensagens %}
          <div class="alert alert-{{ 'danger' if categoria == 'erro' else 'success' }} small py-2 rounded-3">
            <i class="bi bi-{{ 'exclamation-circle' if categoria == 'erro' else 'check-circle' }} me-1"></i>{{ texto }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="post" class="d-grid gap-3">
        <div>
          <label class="form-label small fw-semibold mb-1" for="usuario">Usuário</label>
          <div class="input-group">
            <span class="input-group-text bg-white" style="border-radius: 12px 0 0 12px; border-color: #d7dee9;"><i class="bi bi-person text-muted"></i></span>
            <input type="text" id="usuario" name="usuario" class="form-control" style="border-radius: 0 12px 12px 0;" autocomplete="username" required autofocus>
          </div>
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1" for="senha">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-white" style="border-radius: 12px 0 0 12px; border-color: #d7dee9;"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="senha" name="senha" class="form-control" style="border-radius: 0 12px 12px 0;" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-entrar mt-1">Entrar</button>
      </form>
    </div>

    <div class="rodape">Acesso restrito · Sistema Automático Robotizado</div>
  </div>
</body>
</html>
